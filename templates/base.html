<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Sistem Manajemen{% endblock %}</title>
  <meta name="description" content="Platform manajemen pengguna modern dan aman." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --primary-light: #818cf8;
      --secondary: #0ea5e9;
      --accent: #f43f5e;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --bg: #0f0f1a;
      --bg-card: #1a1a2e;
      --bg-input: #16213e;
      --border: rgba(99,102,241,0.25);
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    a { text-decoration: none; color: inherit; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 20px; border-radius: 10px; border: none;
      font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px;
      cursor: pointer; transition: all 0.25s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff; box-shadow: 0 4px 15px rgba(99,102,241,0.4);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(99,102,241,0.5); }
    .btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; }
    .btn-danger:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(239,68,68,0.4); }
    .btn-success { background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff; }
    .btn-success:hover { transform: translateY(-2px); }
    .btn-warning { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; }
    .btn-warning:hover { transform: translateY(-2px); }
    .btn-ghost {
      background: transparent; color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: var(--bg-input); color: var(--text); }
    .btn-sm { padding: 6px 14px; font-size: 13px; }
    .messages-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
    .alert {
      padding: 14px 20px; border-radius: 12px; font-size: 14px; font-weight: 500;
      display: flex; align-items: center; gap: 10px;
      animation: slideIn 0.3s ease; min-width: 280px; max-width: 400px;
      box-shadow: var(--shadow);
    }
    .alert-success { background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.4); color: #86efac; }
    .alert-warning { background: rgba(245,158,11,0.15); border: 1px solid rgba(245,158,11,0.4); color: #fcd34d; }
    .alert-error { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.4); color: #fca5a5; }
    @keyframes slideIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    {% block extra_styles %}{% endblock %}
  </style>
</head>
<body>

{% if messages %}
<div class="messages-container">
  {% for message in messages %}
  <div class="alert alert-{% if message.tags == 'error' %}error{% elif message.tags == 'warning' %}warning{% else %}success{% endif %}">
    <i class="fa-solid {% if message.tags == 'error' %}fa-circle-xmark{% elif message.tags == 'warning' %}fa-triangle-exclamation{% else %}fa-circle-check{% endif %}"></i>
    {{ message }}
  </div>
  {% endfor %}
</div>
<script>
  setTimeout(() => {
    document.querySelectorAll('.alert').forEach(el => {
      el.style.transition = 'opacity 0.4s';
      el.style.opacity = '0';
      setTimeout(() => el.remove(), 400);
    });
  }, 4000);
</script>
{% endif %}

{% block content %}{% endblock %}

</body>
</html>
