services:
  db:
    image: mariadb:10.11.15
    container_name: db_ecommerce-web
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: thesisstore
      MYSQL_USER: thesisstore_user
      MYSQL_PASSWORD: thesisstore_pass
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3309:3306"
    networks:
      - thesisstore_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: pma_thesisstore
    restart: always
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    ports:
      - "8888:80"
    networks:
      - thesisstore_network

  web:
    build: .
    image: ecommerce-web:latest
    container_name: ecommerce-web-1
    restart: always
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000 --reload"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=1
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,web
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}
      - SUPABASE_JWKS_URL=${SUPABASE_JWKS_URL}
    depends_on:
      - db
    networks:
      - thesisstore_network

volumes:
  db_data:

networks:
  thesisstore_network:
    driver: bridge
